<h1 style="color: #005187;">Plantilla API múltiple</h1>
<form (submit)="$event.preventDefault(); mostrarPlantilla()">
    <label for="selectfunciones">Seleccione una o varias funciones</label>
    <select id="selectfunciones" name="selectfunciones" class="form-control" multiple
        [(ngModel)]="funcionesSeleccionadas">
        @for (fun of funciones; track fun){
            <option [value]="fun">{{fun}}</option>
        }
    </select>
    <button type="submit">Mostrar plantilla</button>
</form>
@if (error) {
    <p style="color: #b00020;">{{ error }}</p>
}
<table class="table table-bordered">
    <thead>
        <tr>
            <th style="background-color: #4d82be">Apellido</th>
            <th style="background-color: #4d82be">Funcion</th>
            <th style="background-color: #4d82be">Turno</th>
            <th style="background-color: #4d82be">Salario</th>
        </tr>
    </thead>
    @for (person of personas; track person){
        <tr>
            <td style="background-color: #4d82be">{{person.apellido}}</td>
            <td style="background-color: #4d82be">{{person.funcion}}</td>
            <td style="background-color: #4d82be">{{person.turno}}</td>
            <td style="background-color: #4d82be">{{person.salario}}</td>
        </tr>
    }
</table>
