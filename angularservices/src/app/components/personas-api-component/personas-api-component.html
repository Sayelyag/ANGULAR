<h1 style="color: #005187;">Service Api Personas</h1>
@for (person of personas; track person) {
  <div>
    <p style="color: #4d82be; text-align: center;">Id: {{person.IdPersona}}</p>
    <p style="color: #4d82be; text-align: center;">Nombre: {{person.Nombre}}</p>
    <p style="color: #4d82be; text-align: center;">Email: {{person.Email}}</p>
    <p style="color: #4d82be; text-align: center;">Edad: {{person.Edad}}</p>
  </div>
}
