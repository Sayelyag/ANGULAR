<h1 style="color: #005187;">Sumar Números</h1>
<form #sumarform="ngForm" (ngSubmit)="sumarNumeros()">
    <label for="numero1" style="color: #4d82be;">Número 1:</label>
    <br/>
    <input type="number" #cajanumero1/>
    <br/>
    <label for="numero2" style="color: #4d82be;">Número 2:</label>
    <br/>
    <input type="number" #cajanumero2/>
    <br/>
    <button type="submit" style="
        background-color: #005187;
        color: #feffff;
        border: 1px solid #005187;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease;
        margin-top: 10px;"
    >
        Sumar
    </button>
    <br/>
    <h2 style="margin-top: 20px; color: #4d82be;">Resultado: {{ suma }}</h2>
</form>
