<h1>Lista de Productos</h1>
<img
  src="https://i.pinimg.com/736x/1f/3e/bf/1f3ebfb14c00fa0a70bb13fb1a3933d5.jpg"
  style="
    display: block;
    margin: 20px auto 0 auto;
    width: 100%;
    max-width: 600px;
    border-radius: 8px;"
/>
<p>{{ producto.nombre }}</p>
<p>Precio: {{ producto.precio }}</p>
<p><img src="{{ producto.imagen }}" style="width: 150px; height: 150px;"></p>

@for (prod of listaproductos; track prod) {
  <p>{{ prod.nombre }}</p>
  <p>Precio: {{ prod.precio }}</p>
  <img src="{{ prod.imagen }}"
    style="width: 150px; height: 150px;">
}
