<h1 style="
  color: #005187;
  text-align: center;
  font-size: 2.2rem;
  font-weight: 700;
  margin: 30px 0 10px;
  letter-spacing: 0.5px;
">
  Editar Departamento
</h1>

<h2 style="
  color: #4d82be;
  text-align: center;
  font-size: 1.2rem;
  font-weight: 500;
  margin-bottom: 30px;
">
  Introduce los datos del departamento
</h2>

<form createform = "ngForm">
  <table class="table table-bordered" style="
    margin: 0 auto 25px;
    width: 800px;
    max-width: 95%;
    border: 1px solid #84b6f4;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0, 81, 135, 0.12);
    background-color: #feffff;
  ">
    <tr>
      <th style="
        background-color: #005187;
        color: #feffff;
        text-align: center;
        vertical-align: middle;
        padding: 16px;
        font-weight: 600;
        width: 35%;
        border-color: #84b6f4;
      ">Id Departamento</th>
      <td style="
        background-color: #feffff;
        padding: 12px 16px;
        border-color: #c4dafa;
      ">
        <input type="number" name = "cajaID" #cajaID class="form-control " style="
          border: 1px solid #84b6f4;
          border-radius: 7px;
          padding: 10px 12px;
          color: #005187;
          background-color: #feffff;
          box-shadow: none;
        " value="{{ departamento?.numero }}" disabled/>
      </td>
    </tr>
    <tr>
      <th style="
        background-color: #005187;
        color: #feffff;
        text-align: center;
        vertical-align: middle;
        padding: 16px;
        font-weight: 600;
        border-color: #84b6f4;
      ">Nombre</th>
      <td style="
        background-color: #feffff;
        padding: 12px 16px;
        border-color: #c4dafa;
      ">
        <input type="text" name="cajaNombre" #cajaNombre class="form-control" style="
          border: 1px solid #84b6f4;
          border-radius: 7px;
          padding: 10px 12px;
          color: #005187;
          background-color: #feffff;
          box-shadow: none;
        "
        value="{{ departamento?.nombre }}" />
      </td>
    </tr>
    <tr>
      <th style="
        background-color: #005187;
        color: #feffff;
        text-align: center;
        vertical-align: middle;
        padding: 16px;
        font-weight: 600;
        border-color: #84b6f4;
      ">Localidad</th>
      <td style="
        background-color: #feffff;
        padding: 12px 16px;
        border-color: #c4dafa;
      ">
        <input type="text" name="cajaLocalidad" #cajaLocalidad class="form-control" style="
          border: 1px solid #84b6f4;
          border-radius: 7px;
          padding: 10px 12px;
          color: #005187;
          background-color: #feffff;
          box-shadow: none;
        "
        value="{{ departamento?.localidad }}" />
      </td>
    </tr>
  </table>

  <div style="
    text-align: center;
    margin: 20px 0 45px;
  ">
    <button class="btn btn-primary" (click)="actualizarDepartamento()"
    style="
      background-color: #005187;
      margin-right: 8px;
      color: #feffff;
      border: 1px solid #005187;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 81, 135, 0.2);
      transition: background-color 0.2s ease, color 0.2s ease;
    ">
    Editar Departamento</button>
  </div>
</form>
